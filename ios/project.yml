name: PhoneKey
options:
  bundleIdPrefix: com.phonekey
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PhoneKey:
    type: application
    platform: iOS
    sources:
      - path: PhoneKey
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phonekey.ios
        INFOPLIST_FILE: PhoneKey/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  PhoneKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneKeyTests
    dependencies:
      - target: PhoneKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phonekey.ios.tests
        GENERATE_INFOPLIST_FILE: YES
